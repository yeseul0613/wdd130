
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(120, 96, 64);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Georgia, serif;
        }

        #formContainer {
            position: relative;
            width: 500px;
            border: 12px solid darkblue;
            border-radius: 35px;
            background-color: white;
            overflow: hidden;
        }

        header {
            background-image: url("images/jesus_feeds_5000.jpeg");
            background-size: cover;
            background-position: center;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 25px;
        }

        h1, h2 {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 3px black;
        }

        h1 {
            font-size: 38px;
        }

        h2 {
            font-size: 30px;
        }

        h3 {
            text-align: center;
            padding: 22px;
            font-size: 21px;
        }

        #closeBtn {
            position: absolute;
            top: 12px;
            left: 15px;
            font-size: 20px;
            padding: 2px 8px;
            cursor: pointer;
            z-index: 2;
        }

        #myForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 15px 22px 22px;
            background-color: white;
        }

        #myForm label {
            font-size: 18px;
        }

        #myForm input[type="text"],
        #myForm input[type="password"],
        #myForm input[type="email"] {
            width: 100%;
            height: 26px;
            font-size: 16px;
        }

        #myForm div {
            display: flex;
            align-items: center;
        }

        #myForm input[type="radio"] {
            margin-right: 4px;
        }

        section {
            grid-column: 1 / 3;
            justify-self: center;
            text-align: center;
        }

        section label {
            font-size: 17px;
        }

        section button {
            padding: 3px 10px;
            font-size: 15px;
            cursor: pointer;
        }

        #scriptures {
            display: flex;
            justify-content: space-between;
            background-color: #171717;
            min-height: 120px;
        }

        #scriptures a {
            flex: 1;
            text-align: center;
            color: tan;
            text-decoration: none;
            font-size: 13px;
            padding: 15px 5px;
            border: 2px solid #555;
            border-top: 3px solid #786040;
        }

        #scriptures a:hover {
            background-color: #333;
        }

        #output {
            color: black;
            margin: 20px;
        }

        @media (max-width: 520px) {
            #formContainer {
                width: 95%;
            }

            #scriptures a {
                font-size: 10px;
            }
        }

    </style>
</head>

<body>

    <div id="formContainer">

        <button type="button" id="closeBtn">X</button>

        <header>
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </header>

        <h3>Sign Up for Daily Scripture Feed</h3>

        <form id="myForm">

            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>

            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">
                    I acknowledge the terms and conditions
                </label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>

        </form>

        <nav id="scriptures">
            <a href="#">OLD<br>TESTAMENT</a>
            <a href="#">NEW<br>TESTAMENT</a>
            <a href="#">BOOK<br>OF<br>MORMON</a>
            <a href="#">DOCTRINE<br>AND<br>COVENANTS</a>
            <a href="#">PEARL OF<br>GREAT PRICE</a>
        </nav>

    </div>

    <div id="output"></div>

    <script>

        // Close button
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
        });

        const form = document.getElementById("myForm");
        const output = document.getElementById("output");

        // Form submit
        form.addEventListener("submit", function (event) {

            event.preventDefault();

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {

                if (key === "password") {
                    entries.push(key + ": [hidden for security]");
                } else {
                    entries.push(key + ": " + value);
                }

            }

            output.innerHTML = `
                <h3>Here is the data that would be sent to the server:</h3>
                <ul>
                    ${entries.map(item => `<li>${item}</li>`).join('')}
                </ul>
            `;

        });

    </script>

</body>
</html>
