<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks</title>
    <style>

        body{
            background: #FFECD7;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 30px 0;
            font-family: Helvetica, sans-serif;
        }

        h1 {
            font-size: 3em;
            color: #FFFFFF;
            font-weight: normal;
            text-align: center;
            font-family: Helvetica, sans-serif;
            margin: 5px 0;
        }

        h1, p{
            text-align: center;
            font-family: Helvetica, sans-serif;
        }

        p {
            color: #91E4FB;
            margin-top: 5px;
        }

        #quote {
            color: #FFD783;
            font-family: "Brush Script MT", cursive;
            font-style: italic;
            font-weight: bold;
            text-align: left;
            line-height: 1.5;
            margin: 35px 15px 5px;
        }

        #card {
            background-color: #008DB1;
            border: 4px solid #004E63;
            border-radius: 30px;
            width: 350px;
            padding: 20px;
            text-align: center;
        }

        img {
            width: 230px;
            height: 280px;
            object-fit: cover;
            border: 5px solid #FFFFFF;
            display: block;
            margin: 0 auto;
        }

        ul {
            color: #FFFFFF;
            font-family: Helvetica, sans-serif;
            font-size: 19px;
            text-align: left;
            display: inline-block;
            margin: 8px auto 0;
            line-height: 1.35;
        }
    </style>
</head>

<body>
    <div id="card">
        <h1>Dallin H. Oaks</h1>
     <p>18th president of the Church of Jesus Christ of Latter-day Saints</p>
     <img src="images/oaks.webp" alt="Portrait of Dallin H Oaks"></img>
     <ul>
        <li>Born: Ang 12, 1932</li>
        <li>Apostle: Apr 7, 1982</li>
        <li>Prophet: Oct 14, 2025</li>
     </ul>
     <p>"The only permanent solution to the differences that divide us is for all teachings and to gradually become even as He is"</p>

    </div>
        
   
</body>
</html>
